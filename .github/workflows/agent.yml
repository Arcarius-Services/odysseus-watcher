name: odysseus-watcher

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odysseus-watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run watcher
        env:
          SUPERTEAM_API_KEY: ${{ secrets.SUPERTEAM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node agent.mjs

      - name: Commit status
        run: |
          git config user.name "odysseus-watcher"
          git config user.email "Arcarius-Services@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "status @ $(date -u +%FT%TZ)"
          git push

      - name: Alert owner on payment
        if: always()
        run: |
          if [ -f NOTIFY.txt ]; then
            echo "::error title=EARNING EVENT::$(cat NOTIFY.txt)"
            exit 1
          fi
          echo "no earning event this run"
